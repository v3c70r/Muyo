name: CI

# Runs on GitHub-hosted runners with mesa's lavapipe as the Vulkan device, so it gates everything that
# does not need a driver: both configurations build, the checked-in API reference matches the headers,
# the changed lines are formatted and clang-tidy clean, and the whole test suite passes with the
# validation layer on.
#
# What it cannot gate, recorded rather than implied - see AGENTS.md section 4 for the axis table:
#
#   * Queue topology. lavapipe reports one queue family with one queue, so no cross-family ownership
#     transfer and no dedicated compute queue is exercised; the suite takes the single-queue path.
#     The "[test device]" line the job records says so on every run.
#   * Driver-specific behaviour. A software device passing is not evidence about a driver.
#   * Descriptor heap. The runner's Mesa may not expose VK_EXT_descriptor_heap or
#     shaderUntypedPointers; the [DescriptorHeap] probe then skips with the reason and the
#     "[test device]" line records the absent bits. That is a recorded gap, not a green heap result;
#     the B0 hardware matrix (RADV, RTX 3090, qualifying llvmpipe) is the evidence for that path.
#
# Those three stay with the development machine and the review machine, which is where the hardware
# runbook in AGENTS.md section 6 already puts them. A green run here is evidence about a code and
# validation-layer pair on a software device, and the job prints both so the claim is self-describing.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Pinned, because the whole point of moving off the apt repository is that `vulkan-sdk` there tracks
  # whatever is current and this repository records the version a run used. Matches the development
  # machine's $VULKAN_SDK so CI and a local build are the same SDK.
  VULKAN_SDK_VERSION: "1.4.363.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-format:
    name: docs + format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The format check diffs against the merge base with master, so it needs the history.
          fetch-depth: 0

      # No build, and so no compiler, no X11 packages and no Vulkan SDK: the docs check runs doxygen
      # and the format check runs clang-format on a diff. Building here as well used to repeat the
      # Debug and Debug+RT builds the test matrix already does - 189 s of the job's 270 - for a job
      # whose own two checks take one second and zero. The build gate is the matrix, which builds each
      # configuration once *and* runs it, which is strictly stronger than a build-only job.
      - name: Install doxygen and clang-format
        run: |
          sudo apt-get update
          # doxygen: the checked-in RenderGraph-api.md is generated with 1.9.8, which is this release's
          # package (docs/README.md). A different version is a suspected cause of a --check mismatch.
          sudo apt-get install -y --no-install-recommends python3 doxygen clang-format git

      - name: Record the tool versions this run used
        run: |
          echo "doxygen       $(doxygen --version)"
          echo "clang-format  $(clang-format --version)"

      - name: Documentation coverage and the checked-in reference
        run: python3 scripts/render_graph_docs.py --check

      - name: No descriptor-set path on the graph path
        run: python3 scripts/check_descriptor_path.py

      - name: Format the lines this change touched
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          scripts/sanity.sh format

  tidy:
    name: clang-tidy (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The gate diffs against the merge base with master, so it needs the history.
          fetch-depth: 0

      - name: Install clang-tidy and the configure dependencies
        run: |
          sudo apt-get update
          # clang-tidy-18 is the pinned version (AGENTS.md section 5); a bump is a measured change.
          # No Vulkan SDK: clang-tidy needs a compilation database and the project's headers, not
          # slangc or the validation layer.
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-18 cmake ninja-build python3 \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libvulkan1 libvulkan-dev

      # The configure step needs both shader compilers: `glslangValidator` and `slangc` are FATAL_ERRORs
      # (CMakeLists.txt:136, 146), and only the SDK ships `slangc`. Cached by version, like the test jobs.
      - name: Install the Vulkan SDK (pinned)
        uses: ./.github/actions/install-vulkan-sdk
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Record the tool versions this run used
        run: |
          clang-tidy-18 --version
          clang-tidy-diff-18.py --help >/dev/null && echo "clang-tidy-diff-18.py present"

      - name: Configure (the compile database is all clang-tidy needs)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFEATURE_RAY_TRACING=OFF \
                -DGLFW_BUILD_WAYLAND=OFF

      - name: Tidy the lines this change touched
        run: |
          # pipefail matters: a bare `| tee` reports tee's status, so a failing gate would show a green
          # step with a failure in the summary. The gate's exit status is the verdict.
          set -o pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          # Strip ANSI codes so the step summary renders as text rather than escape sequences.
          BASE=origin/master scripts/sanity.sh tidy 2>&1 \
            | sed $'s/\x1b\\[[0-9;]*m//g' \
            | tee -a "$GITHUB_STEP_SUMMARY"

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debug,           build_type: Debug,    rt: OFF, dir: build }
          - { name: Release,         build_type: Release,  rt: OFF, dir: build }
          - { name: Debug + RT,      build_type: Debug,    rt: ON,  dir: build-rt }
          - { name: Release + RT,    build_type: Release,  rt: ON,  dir: build-rt }
          - { name: Sanitize,        build_type: Sanitize, rt: OFF, dir: build-san }
    env:
      # The suite is headless by design - no glfwInit and no VkSurface anywhere under src/tests - so
      # this runs with no display at all, deliberately. That is the test: a green run here is evidence
      # for the Consumers.md row that says no surface, present or swapchain is required on the
      # execution path, and setting up a virtual display would remove the chance to show it.
      DISPLAY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libvulkan1 libvulkan-dev mesa-vulkan-drivers
          # Not vulkan-validationlayers or vulkan-tools: the SDK ships both, and adding the
          # distribution's copies would make *which* layer loads - and which vulkaninfo reports -
          # depend on path order. The layer a run uses is the SDK's, which is the version the
          # hardware runs record.

      - name: Install the Vulkan SDK (tarball, pinned)
        uses: ./.github/actions/install-vulkan-sdk
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Configure and build
        run: |
          cmake -S . -B ${{ matrix.dir }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DFEATURE_RAY_TRACING=${{ matrix.rt }} -DGLFW_BUILD_WAYLAND=OFF
          cmake --build ${{ matrix.dir }} --target tests Shaders -j"$(nproc)"

      - name: Run the suite
        run: |
          # tests and assets are both read relative to the working directory (AGENTS.md section 4).
          ln -sfn "$PWD/assets" ${{ matrix.dir }}/assets
          cd ${{ matrix.dir }}
          set +e
          # Kept identical to `sanitizer_env` in scripts/sanity.sh: a local run and a CI run must be the
          # same experiment, or a green CI check stops meaning what a green local run means. The UBSan and
          # ASan options are ignored by builds that have no sanitizer.
          # `fast_unwind_on_malloc=0` is what makes a leak stack name a module instead of one frame (#171).
          run_env=(
            ASAN_OPTIONS="detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1"
            UBSAN_OPTIONS="print_stacktrace=1"
            LSAN_OPTIONS="suppressions=$PWD/../san.supp:print_suppressions=1:fast_unwind_on_malloc=0"
          )
          # State the experiment in the log it belongs to: the report that named the loader leak (#189)
          # had to be reconstructible from the run, not inferred from the workflow file.
          printf 'run env: %s\n' "${run_env[@]}"
          env "${run_env[@]}" ./tests > tests.out 2> tests.err
          status=$?
          set -e
          tail -3 tests.out
          # The sanitizer writes its report to stderr. Printing only the stdout tail made a failure read as
          # "All tests passed" followed by a non-zero exit, with the reason discarded (#171). The report is
          # printed from the first sanitizer ERROR to the end rather than through a grep: the filtered
          # version showed only the lines matching the pattern, so a leak's frames - which match neither
          # `leak` nor `ERROR` - were exactly what it hid (#189).
          if [ $status -ne 0 ]; then
            echo "─ sanitizer report (complete block, first 200 lines) ─"
            sed -n '/ERROR: \(Address\|Leak\)Sanitizer/,$p' tests.err | head -200 || true
            echo "─ tests.err tail ─"
            tail -40 tests.err || true
            # The hosted runner's software driver and loader allocate inside uninstrumented modules, so
            # LeakSanitizer reports their allocations with no symbolizable frame (#189). Fail only when a
            # leak's allocation is attributable to this repository - and only when the suite itself passed
            # and exited 1, so this cannot excuse a test failure or an abort from a validation error.
            if [ "$status" -eq 1 ] && grep -q "All tests passed" tests.out \
               && python3 ../scripts/check_sanitizer_report.py --err tests.err; then
              echo "::warning::the suite passed; every leak is allocated outside this repository (#189)"
              exit 0
            fi
          fi
          exit $status

      - name: Upload the sanitizer report
        # The next red run names its leaker even if the log is truncated (#189 criterion 1).
        if: failure() && matrix.build_type == 'Sanitize'
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-tests-err
          path: ${{ matrix.dir }}/tests.err
          if-no-files-found: warn

      - name: Record what this run was
        if: always()
        run: |
          cd ${{ matrix.dir }}
          # Both to the log and to the step summary. The log because that is how this repository reads
          # a run - grep it - and the summary because a green check should say what it covered without
          # anyone opening the log. The same text, generated once.
          {
            echo "### ${{ matrix.name }}"
            echo
            grep -F "[test device]" tests.err || echo "no [test device] line: the suite did not create a device"
            grep -F "[descriptor heap]" tests.err || echo "no [descriptor heap] line: the heap probe row is a gap"
            echo "mesa-vulkan-drivers: $(dpkg-query -W -f='${Version}' mesa-vulkan-drivers 2>/dev/null || echo unknown)"
            grep -E "test cases:" tests.out || true
            vulkaninfo 2>/dev/null | grep -m1 "KHRONOS_validation" || echo "no validation layer line"
            echo "queue counts: $(vulkaninfo 2>/dev/null | grep -c queueCount) families reported below"
            vulkaninfo 2>/dev/null | grep -E "queueCount" || true
            # The one expected exclusion is computed rather than left to the reader. The fork test
            # deliberately passes a bad pointer to vkWaitForFences and inherits the parent's stderr, so
            # two occurrences of that VUID are the *clean* result (AGENTS.md section 6) - and the
            # difference between a clean run and a run with one real validation error is otherwise a
            # memory test. Printing the delta makes "clean" one number.
            expected="VUID-vkWaitForFences-pFences-parameter"
            seen=$(grep -oE "#?VUID-[A-Za-z0-9-]+" tests.err 2>/dev/null | tr -d '#' | sort -u || true)
            unexpected=$(printf '%s\n' "$seen" | grep -v -x "$expected" | grep -c . || true)
            # The toolchain states itself in the same block as the device does: a result is only evidence
            # about the compiler and sanitizer configuration that produced it, and both machines switch
            # between several. `-fno-sanitize-recover` is checked rather than assumed, because a build that
            # recovers prints `runtime error:` and still exits 0.
            echo "compiler: $(c++ --version | head -1)"
            if [ "${{ matrix.build_type }}" = "Sanitize" ]; then
              # Paths are relative to this step's directory (it `cd`s into the build dir first). The
              # first version of these lines used `${{ matrix.dir }}/compile_commands.json`, which is a
              # doubled path, and `|| true` turned the resulting empty string into a silent blank - a
              # check that could not fail, in the block whose purpose is to make failures attributable.
              # It now prints a count that *proves the scoping*: every project translation unit disables
              # UBSan recovery, and the vendored ones do not.
              if [ -f compile_commands.json ]; then
                entries=$(python3 -c "import json;print(len(json.load(open('compile_commands.json'))))" 2>/dev/null || true)
                with_flag=$(python3 -c "import json;print(sum(1 for e in json.load(open('compile_commands.json')) if '-fno-sanitize-recover' in e['command']))" 2>/dev/null || true)
                echo "compile entries: ${entries:-unknown}, UBSan recovery disabled in: ${with_flag:-unknown} (the rest are vendored targets, deliberately unscoped)"
              else
                echo "::error::compile_commands.json missing in the build directory - the sanitizer flag check cannot run"
              fi
              diagnostics=$(grep -cE 'ERROR: (Address|Leak)Sanitizer|runtime error:' tests.err 2>/dev/null || true)
              echo "sanitizer diagnostics in tests.err: ${diagnostics:-0}"
            fi
            echo "validation VUIDs seen: $(printf '%s' "$seen" | tr '\n' ' ')"
            echo "unexpected VUIDs: $unexpected"
            if [ "$unexpected" != "0" ]; then
              echo "::error::$unexpected unexpected validation message(s); the debug callback asserts on ERROR, so this run should have aborted"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
