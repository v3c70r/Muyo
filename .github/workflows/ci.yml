name: CI

# Runs on GitHub-hosted runners with Mesa lavapipe as the Vulkan device on Linux and Windows, so it
# gates everything that does not need a hardware driver: both Linux configurations build, the Windows
# MSVC target builds and runs tests, the checked-in API reference matches the headers, the changed lines
# are formatted and clang-tidy clean, the Linux test suite passes with the validation layer on, and the
# installed package is configured by an out-of-tree consumer.
#
# What it cannot gate, recorded rather than implied - see AGENTS.md section 4 for the axis table:
#
#   * Queue topology. lavapipe reports one queue family with one queue, so no cross-family ownership
#     transfer and no dedicated compute queue is exercised; the suite takes the single-queue path.
#     The "[test device]" line the job records says so on every run.
#   * Driver-specific behaviour. A software device passing is not evidence about a driver.
#   * Descriptor heap. The `[DescriptorHeap]` cases moved to muyo-renderer with the renderer suite
#     (#318), and that repository has no CI yet (v3c70r/muyo-renderer#4). This workflow exercises no heap
#     path at all, and whether a runner's Mesa exposes the extensions no longer changes what runs here.
#     Neither runner was the evidence for the hardware heap path: the B0 hardware matrix (RADV,
#     RTX 3090, qualifying llvmpipe) remains that evidence, reproducible through the renderer's suite.
#
# Those three stay with the development machine and the review machine, which is where the hardware
# runbook in AGENTS.md section 6 already puts them. A green run here is evidence about a code and
# validation-layer pair on a software device, and the job prints both so the claim is self-describing.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Pinned, because the whole point of moving off the apt repository is that `vulkan-sdk` there tracks
  # whatever is current and this repository records the version a run used. Matches the development
  # machine's $VULKAN_SDK so CI and a local build are the same SDK.
  VULKAN_SDK_VERSION: "1.4.363.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-format:
    name: docs + format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The format check diffs against the merge base with master, so it needs the history.
          fetch-depth: 0

      # No build, and so no compiler, no X11 packages and no Vulkan SDK: the docs check runs doxygen
      # and the format check runs clang-format on a diff. Building here as well used to repeat the
      # Debug and Debug+RT builds the test matrix already does - 189 s of the job's 270 - for a job
      # whose own two checks take one second and zero. The build gate is the matrix, which builds each
      # configuration once *and* runs it, which is strictly stronger than a build-only job.
      - name: Install doxygen and clang-format
        run: |
          sudo apt-get update
          # doxygen: the checked-in RenderGraph-api.md is generated with 1.9.8, which is this release's
          # package (docs/README.md). A different version is a suspected cause of a --check mismatch.
          sudo apt-get install -y --no-install-recommends python3 doxygen clang-format git

      - name: Record the tool versions this run used
        run: |
          echo "doxygen       $(doxygen --version)"
          echo "clang-format  $(clang-format --version)"

      - name: Documentation coverage and the checked-in reference
        run: python3 scripts/render_graph_docs.py --check

      - name: Install-list parser self-test
        # Proves the install-set check still has teeth after the #299 review P1: a header commented
        # out of `MUYO_RG_PUBLIC_HEADERS` must no longer parse as installed.
        run: python3 scripts/render_graph_docs.py --self-test

      - name: No descriptor-set path on the graph path
        run: python3 scripts/check_descriptor_path.py

      - name: Format the lines this change touched
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          scripts/sanity.sh format

  tidy:
    name: clang-tidy (changed lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The gate diffs against the merge base with master, so it needs the history.
          fetch-depth: 0

      - name: Install clang-tidy and the configure dependencies
        run: |
          sudo apt-get update
          # clang-tidy-18 is the pinned version (AGENTS.md section 5); a bump is a measured change.
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-18 cmake ninja-build python3 \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libvulkan1 libvulkan-dev

      # The SDK stays on this job for its Vulkan 1.4 headers, not for shader compilers: the
      # distribution's libvulkan-dev is older and has no VK_EXT_descriptor_heap types, so clang-tidy
      # cannot compile VkRenderDevice.h against it. No `slangc`/`glslangValidator` runs here now that
      # the shader corpus moved out (#318).
      - name: Install the Vulkan SDK (pinned)
        uses: ./.github/actions/install-vulkan-sdk
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Record the tool versions this run used
        run: |
          clang-tidy-18 --version
          clang-tidy-diff-18.py --help >/dev/null && echo "clang-tidy-diff-18.py present"

      - name: Configure (the compile database is all clang-tidy needs)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFEATURE_RAY_TRACING=OFF

      - name: Tidy the lines this change touched
        run: |
          # pipefail matters: a bare `| tee` reports tee's status, so a failing gate would show a green
          # step with a failure in the summary. The gate's exit status is the verdict.
          set -o pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          # Strip ANSI codes so the step summary renders as text rather than escape sequences.
          BASE=origin/master scripts/sanity.sh tidy 2>&1 \
            | sed $'s/\x1b\\[[0-9;]*m//g' \
            | tee -a "$GITHUB_STEP_SUMMARY"

  windows-build:
    name: Windows (MSVC 2026 + lavapipe)
    runs-on: windows-2025-vs2026
    env:
      # Serializes concurrent MSVC writes to shared PDBs without replacing CMake's default compiler flags.
      CL: /FS
      # Mesa 26.2.6's MSVC package has a known Vulkan software-rendering regression; keep the
      # lavapipe package pinned to the preceding working release until that is resolved upstream.
      MESA_DIST_VERSION: "26.2.5"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process -FilePath $installer `
            -ArgumentList @("--accept-licenses", "--default-answer", "--confirm-command", "install") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($process.ExitCode)"
          }
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          # The build consumes the SDK's Vulkan 1.4 headers, layer and loader. It no longer uses
          # `slangc` (#318), so checking for that component would fail installs over an unused tool.
          if (-not (Test-Path (Join-Path $sdk "Include\vulkan\vulkan.h"))) {
            throw "Vulkan SDK install is missing Include\vulkan\vulkan.h at $sdk"
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "VK_LAYER_PATH=$(Join-Path $sdk 'Bin')" >> $env:GITHUB_ENV
          (Join-Path $sdk "Bin") >> $env:GITHUB_PATH

      - name: Install the pinned Mesa lavapipe ICD
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mesa3d-$env:MESA_DIST_VERSION-release-msvc.7z"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_DIST_VERSION/mesa3d-$env:MESA_DIST_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expectedHash = "997123ef4ce8896204ab912d5b54f19372c487ff9835bcefafa2fca23b8953c2"
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Mesa archive SHA256 mismatch: $actualHash"
          }
          $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa-lavapipe"
          New-Item -ItemType Directory -Path $mesaRoot -Force | Out-Null
          & 7z x $archive "-o$mesaRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract Mesa lavapipe archive (exit code $LASTEXITCODE)"
          }
          $icd = Get-ChildItem -Path $mesaRoot -Filter "lvp_icd.x86_64.json" -Recurse | Select-Object -First 1
          if ($null -eq $icd) {
            throw "Mesa archive does not contain lvp_icd.x86_64.json"
          }
          # The archive names its library relatively (`\\.\\vulkan_lvp.dll`). Make it absolute so
          # discovery does not depend on the loader's idea of the working directory.
          $library = Join-Path $icd.DirectoryName "vulkan_lvp.dll"
          if (-not (Test-Path $library)) {
            throw "Mesa archive has no vulkan_lvp.dll beside $($icd.FullName)"
          }
          $manifest = Get-Content $icd.FullName -Raw | ConvertFrom-Json
          $manifest.ICD.library_path = $library
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $icd.FullName -Encoding utf8

          # Three discovery routes, because which one the loader honours is a property of the loader
          # on the image rather than of the loader this repository pins: the current variable name,
          # the legacy name, and the Windows registry key the loader reads on this image.
          "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
          "VK_ICD_FILENAMES=$($icd.FullName)" >> $env:GITHUB_ENV
          $drivers = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
          New-Item -Path $drivers -Force | Out-Null
          New-ItemProperty -Path $drivers -Name $icd.FullName -Value 0 -PropertyType DWord -Force | Out-Null
          $icd.DirectoryName >> $env:GITHUB_PATH

      - name: Configure with Visual Studio 2026
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          -DFEATURE_RAY_TRACING=OFF

      - name: Build both test binaries
        # Both test binaries: since the renderer split (#318) `tests` covers `muyo_rg`/`muyo_device`
        # without a device, and `rg_tests` is the one that runs a graph on it and prints `[test device]`.
        # No `Shaders` target: the shader corpus moved to `muyo-renderer` (#318).
        run: cmake --build build --config Debug --target tests rg_tests --parallel 2

      - name: Verify lavapipe is selected
        shell: pwsh
        run: |
          # The pinned SDK ships the SDK build of vulkaninfo as vulkaninfoSDK.exe; there is no
          # vulkaninfo.exe under Bin, which is why this looked for a name that never exists.
          $vulkanInfo = Join-Path $env:VULKAN_SDK "Bin\vulkaninfoSDK.exe"
          if (-not (Test-Path $vulkanInfo)) {
            throw "The pinned Vulkan SDK has no Bin\vulkaninfoSDK.exe"
          }
          # Record what the loader actually is, so a future failure here is diagnosable from the log
          # rather than from another run. vulkaninfoSDK.exe statically links its own loader; the test
          # binary does not, so the System32 loader is the one the suite will use.
          Write-Output "vulkaninfoSDK: $((Get-Item $vulkanInfo).VersionInfo.ProductVersion)"
          $systemLoader = Join-Path $env:SystemRoot "System32\vulkan-1.dll"
          if (Test-Path $systemLoader) {
            $loaderVersion = (Get-Item $systemLoader).VersionInfo.FileVersion
            Write-Output "System32 vulkan-1.dll: $loaderVersion"
          } else {
            Write-Output "System32 vulkan-1.dll: absent"
          }
          Write-Output "VK_DRIVER_FILES: [$env:VK_DRIVER_FILES]"
          Write-Output "ICD manifest exists: $(Test-Path $env:VK_DRIVER_FILES)"
          $env:VK_LOADER_DEBUG = "error,warn"
          $summary = & $vulkanInfo --summary 2>&1
          if ($LASTEXITCODE -ne 0) {
            $summary | Write-Output
            throw "vulkaninfo failed with exit code $LASTEXITCODE"
          }
          $summary | Write-Output
          if (($summary -join "`n") -notmatch "llvmpipe|lavapipe") {
            throw "The selected Vulkan device is not lavapipe"
          }

      - name: Run the suite on lavapipe
        shell: pwsh
        run: |
          Push-Location build
          try {
            # Both binaries, one log: `tests` and `rg_tests` are the suite after the renderer split
            # (#318), and `rg_tests` is what prints `[test device]`.
            & .\tests.exe *> tests.log
            $testExitCode = $LASTEXITCODE
            & .\rg_tests.exe *>> tests.log
            $rgExitCode = $LASTEXITCODE
            Get-Content tests.log | Write-Output
            if ($testExitCode -ne 0) {
              throw "tests.exe failed with exit code $testExitCode"
            }
            if ($rgExitCode -ne 0) {
              throw "rg_tests.exe failed with exit code $rgExitCode"
            }
            $testDevice = Select-String -Path tests.log -Pattern '\[test device\]' | Select-Object -First 1
            # One summary line per binary: Catch2 prints "test cases: N | ..." when a case is skipped
            # or fails, and "All tests passed (N assertions in M test cases)" when every case passes -
            # the form the Windows lavapipe run produces. Accept both.
            $testCounts = (Select-String -Path tests.log -Pattern 'All tests passed|test cases:' |
              ForEach-Object { $_.Line.Trim() }) -join ' | '
            if ($null -eq $testDevice -or $testDevice.Line -notmatch 'llvmpipe|lavapipe') {
              throw 'The test run did not report lavapipe as its Vulkan device'
            }
            if ([string]::IsNullOrEmpty($testCounts)) {
              throw 'The test run did not report a Catch2 test count'
            }
            @(
              '### Windows tests (MSVC + lavapipe)'
              ''
              $testDevice.Line
              $testCounts
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          finally {
            Pop-Location
          }

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debug,           build_type: Debug,    rt: OFF, dir: build }
          - { name: Release,         build_type: Release,  rt: OFF, dir: build }
          - { name: Debug + RT,      build_type: Debug,    rt: ON,  dir: build-rt }
          - { name: Release + RT,    build_type: Release,  rt: ON,  dir: build-rt }
          - { name: Sanitize,        build_type: Sanitize, rt: OFF, dir: build-san }
    env:
      # The suite is headless by design - no glfwInit and no VkSurface anywhere under src/tests - so
      # this runs with no display at all, deliberately. That is the test: a green run here is evidence
      # for the Consumers.md row that says no surface, present or swapchain is required on the
      # execution path, and setting up a virtual display would remove the chance to show it.
      DISPLAY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libvulkan1 libvulkan-dev mesa-vulkan-drivers
          # Not vulkan-validationlayers or vulkan-tools: the SDK ships both, and adding the
          # distribution's copies would make *which* layer loads - and which vulkaninfo reports -
          # depend on path order. The layer a run uses is the SDK's, which is the version the
          # hardware runs record.

      - name: Install the Vulkan SDK (tarball, pinned)
        uses: ./.github/actions/install-vulkan-sdk
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Configure and build
        run: |
          cmake -S . -B ${{ matrix.dir }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFEATURE_RAY_TRACING=${{ matrix.rt }}
          # Both binaries: `tests` is the device-free suite and `rg_tests` is the graph/device one. Since
          # the renderer split (#318) neither alone is "the suite", and neither needs a `Shaders` build.
          cmake --build ${{ matrix.dir }} --target tests rg_tests -j"$(nproc)"

      - name: Run the suite
        run: |
          cd ${{ matrix.dir }}
          set +e
          # Kept identical to `sanitizer_env` in scripts/sanity.sh: a local run and a CI run must be the
          # same experiment, or a green CI check stops meaning what a green local run means. The UBSan and
          # ASan options are ignored by builds that have no sanitizer.
          # `fast_unwind_on_malloc=0` is what makes a leak stack name a module instead of one frame (#171).
          run_env=(
            ASAN_OPTIONS="detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1"
            UBSAN_OPTIONS="print_stacktrace=1"
            LSAN_OPTIONS="suppressions=$PWD/../san.supp:print_suppressions=1:fast_unwind_on_malloc=0"
          )
          # State the experiment in the log it belongs to: the report that named the loader leak (#189)
          # had to be reconstructible from the run, not inferred from the workflow file.
          printf 'run env: %s\n' "${run_env[@]}"
          # One log pair for both binaries, so the `[test device]` line, the validation VUIDs and the
          # sanitizer report are all in the files the later steps read. `rg_tests` is what creates the
          # device and prints that line now.
          env "${run_env[@]}" ./tests > tests.out 2> tests.err
          status=$?
          env "${run_env[@]}" ./rg_tests >> tests.out 2>> tests.err
          rg_status=$?
          if [ "$status" -eq 0 ] && [ "$rg_status" -ne 0 ]; then
            status=$rg_status
          fi
          # "The suite passed" must mean both binaries said so: one Catch2 summary line per binary.
          suite_passed=0
          if [ "$(grep -c 'All tests passed' tests.out)" -ge 2 ]; then
            suite_passed=1
          fi
          set -e
          tail -3 tests.out
          # The sanitizer writes its report to stderr. Printing only the stdout tail made a failure read as
          # "All tests passed" followed by a non-zero exit, with the reason discarded (#171). The report is
          # printed from the first sanitizer ERROR to the end rather than through a grep: the filtered
          # version showed only the lines matching the pattern, so a leak's frames - which match neither
          # `leak` nor `ERROR` - were exactly what it hid (#189).
          if [ $status -ne 0 ]; then
            echo "─ sanitizer report (complete block, first 200 lines) ─"
            sed -n '/ERROR: \(Address\|Leak\)Sanitizer/,$p' tests.err | head -200 || true
            echo "─ tests.err tail ─"
            tail -40 tests.err || true
            # The hosted runner's software driver and loader allocate inside uninstrumented modules, so
            # LeakSanitizer reports their allocations with no symbolizable frame (#189). Fail only when a
            # leak's allocation is attributable to this repository - and only when the suite itself passed
            # and exited 1, so this cannot excuse a test failure or an abort from a validation error.
            if [ "$status" -eq 1 ] && [ "$suite_passed" -eq 1 ] \
               && python3 ../scripts/check_sanitizer_report.py --err tests.err; then
              echo "::warning::the suite passed; every leak is allocated outside this repository (#189)"
              exit 0
            fi
          fi
          exit $status

      - name: Upload the sanitizer report
        # The next red run names its leaker even if the log is truncated (#189 criterion 1).
        if: failure() && matrix.build_type == 'Sanitize'
        uses: actions/upload-artifact@v4
        with:
          name: sanitize-tests-err
          path: ${{ matrix.dir }}/tests.err
          if-no-files-found: warn

      - name: Record what this run was
        if: always()
        run: |
          cd ${{ matrix.dir }}
          # Both to the log and to the step summary. The log because that is how this repository reads
          # a run - grep it - and the summary because a green check should say what it covered without
          # anyone opening the log. The same text, generated once.
          {
            echo "### ${{ matrix.name }}"
            echo
            grep -F "[test device]" tests.err || echo "no [test device] line: the suite did not create a device"
            grep -F "[descriptor heap]" tests.err || echo "no [descriptor heap] line: the heap probe row is a gap"
            echo "mesa-vulkan-drivers: $(dpkg-query -W -f='${Version}' mesa-vulkan-drivers 2>/dev/null || echo unknown)"
            grep -E "test cases:" tests.out || true
            vulkaninfo 2>/dev/null | grep -m1 "KHRONOS_validation" || echo "no validation layer line"
            echo "queue counts: $(vulkaninfo 2>/dev/null | grep -c queueCount) families reported below"
            vulkaninfo 2>/dev/null | grep -E "queueCount" || true
            # No exclusion is subtracted. The one deliberate VUID this used to forgive
            # (`VUID-vkWaitForFences-pFences-parameter`) came from the fork test in `DebugCallbackTests`,
            # which moved to muyo-renderer with the renderer suite (#318); every VUID seen here is
            # unexpected.
            seen=$(grep -oE "#?VUID-[A-Za-z0-9-]+" tests.err 2>/dev/null | tr -d '#' | sort -u || true)
            unexpected=$(printf '%s\n' "$seen" | grep -c . || true)
            # The toolchain states itself in the same block as the device does: a result is only evidence
            # about the compiler and sanitizer configuration that produced it, and both machines switch
            # between several. `-fno-sanitize-recover` is checked rather than assumed, because a build that
            # recovers prints `runtime error:` and still exits 0.
            echo "compiler: $(c++ --version | head -1)"
            if [ "${{ matrix.build_type }}" = "Sanitize" ]; then
              # Paths are relative to this step's directory (it `cd`s into the build dir first). The
              # first version of these lines used `${{ matrix.dir }}/compile_commands.json`, which is a
              # doubled path, and `|| true` turned the resulting empty string into a silent blank - a
              # check that could not fail, in the block whose purpose is to make failures attributable.
              # It now prints a count that *proves the scoping*: every project translation unit disables
              # UBSan recovery, and the vendored ones do not.
              if [ -f compile_commands.json ]; then
                entries=$(python3 -c "import json;print(len(json.load(open('compile_commands.json'))))" 2>/dev/null || true)
                with_flag=$(python3 -c "import json;print(sum(1 for e in json.load(open('compile_commands.json')) if '-fno-sanitize-recover' in e['command']))" 2>/dev/null || true)
                echo "compile entries: ${entries:-unknown}, UBSan recovery disabled in: ${with_flag:-unknown} (the rest are vendored targets, deliberately unscoped)"
              else
                echo "::error::compile_commands.json missing in the build directory - the sanitizer flag check cannot run"
              fi
              diagnostics=$(grep -cE 'ERROR: (Address|Leak)Sanitizer|runtime error:' tests.err 2>/dev/null || true)
              echo "sanitizer diagnostics in tests.err: ${diagnostics:-0}"
            fi
            echo "validation VUIDs seen: $(printf '%s' "$seen" | tr '\n' ' ')"
            echo "unexpected VUIDs: $unexpected"
            if [ "$unexpected" != "0" ]; then
              echo "::error::$unexpected unexpected validation message(s); the debug callback asserts on ERROR, so this run should have aborted"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The installed package and an out-of-tree consumer (#298, #73). Separate from the test matrix
  # because its subject is not the device: the probe constructs public values and creates no
  # VkDevice, so this job needs no GPU and no display. What it gates is the packaging boundary - the
  # exported include directories, the dependency lookup and the config file - which the in-tree build
  # cannot see because it links the source tree's targets directly.
  package:
    name: package (install + out-of-tree consumer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 \
            libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libvulkan1 libvulkan-dev

      - name: Install the Vulkan SDK (tarball, pinned)
        uses: ./.github/actions/install-vulkan-sdk
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}

      - name: Record the tool versions this run used
        run: |
          # The SDK version is part of the result, the way it is for every test-matrix job: a package
          # that configures against one Vulkan SDK is evidence about that code-and-SDK pair.
          {
            echo "### package (install + out-of-tree consumer)"
            echo
            echo "Vulkan SDK: ${VULKAN_SDK_VERSION} (${VULKAN_SDK})"
            echo "cmake: $(cmake --version | head -1)"
            echo "compiler: $(c++ --version | head -1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure and build Release
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFEATURE_RAY_TRACING=OFF
          cmake --build build --target muyo_rg -j"$(nproc)"

      - name: Install to a throwaway prefix
        run: |
          PREFIX="$RUNNER_TEMP/muyo-install"
          rm -rf "$PREFIX"
          cmake --install build --prefix "$PREFIX"
          echo "installed $(find "$PREFIX" -type f | wc -l) files under $PREFIX"
          find "$PREFIX/include" -type f | sort

      - name: Assert the installed public surface
        # Exactly `PUBLIC_HEADERS` under include/RenderGraph, no include/Muyo/detail/RenderGraph, and
        # the package files and libraries a consumer links. The source-side docs check compares the
        # CMake list with the canonical list; this compares the *installed* tree, which is the artifact.
        run: python3 scripts/check_installed_package.py --prefix "$RUNNER_TEMP/muyo-install"

      - name: Configure and build the out-of-tree probe
        run: |
          # Only the prefix is supplied: no source-tree include directory and no source-tree target,
          # so a missing export fails here the way it would fail for a consumer.
          cmake -S scripts/package-probe -B "$RUNNER_TEMP/muyo-package-probe" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/muyo-install"
          # The cache is the mechanical proof that find_package took the installed package rather than
          # something else on the runner: the resolved package directory is inside the prefix.
          if ! grep -qF "muyo_rg_DIR:PATH=$RUNNER_TEMP/muyo-install/" \
                "$RUNNER_TEMP/muyo-package-probe/CMakeCache.txt"; then
            echo "::error::muyo_rg was not resolved from the installed prefix"
            grep -E "muyo_rg_DIR|CMAKE_PREFIX_PATH" "$RUNNER_TEMP/muyo-package-probe/CMakeCache.txt" || true
            exit 1
          fi
          cmake --build "$RUNNER_TEMP/muyo-package-probe" -j"$(nproc)"

      - name: Run the probe
        run: |
          # `set -e` makes the probe's exit status the step's, and the printed line is asserted rather
          # than only displayed so a version regression fails here and not at a consumer.
          set -e
          output="$("$RUNNER_TEMP/muyo-package-probe/package_probe")"
          echo "$output"
          case "$output" in
            "muyo_rg 0.1."*) ;;
            *)
              echo "::error::the probe did not report a muyo_rg 0.1 version: $output"
              exit 1
              ;;
          esac
          echo "probe: $output" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure with Vulkan hidden (the dependency failure path)
        run: |
          log="$RUNNER_TEMP/muyo-package-probe-no-vulkan.log"
          if cmake -S scripts/package-probe -B "$RUNNER_TEMP/muyo-package-probe-no-vulkan" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/muyo-install" \
                -DCMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON >"$log" 2>&1; then
            echo "::error::the probe configured with CMAKE_DISABLE_FIND_PACKAGE_Vulkan=ON"
            cat "$log"
            exit 1
          fi
          cat "$log"
          # The exact text find_dependency() gives when the required dependency is missing. This is the
          # acceptance criterion: a missing SDK fails at the consumer's configure step naming Vulkan,
          # rather than at a compile or link later.
          if ! grep -qF "muyo_rg could not be found because dependency Vulkan could not be found" "$log"; then
            echo "::error::the failure did not name Vulkan as the missing dependency"
            exit 1
          fi
          echo "hidden Vulkan: configure failed naming Vulkan, as intended" >> "$GITHUB_STEP_SUMMARY"
